    <text x="215" y="276" font-family="Inter, Roboto, SF Pro, sans-serif" font-size="22" font-weight="800" fill="#DC2626">42</text>
    <text x="356" y="275" text-anchor="end" font-family="Inter, Roboto, SF Pro, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">14 overdue</text>
