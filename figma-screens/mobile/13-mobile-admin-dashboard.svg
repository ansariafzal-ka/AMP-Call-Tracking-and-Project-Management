    <rect x="36" y="428" width="181" height="7" rx="3.5" fill="#C89D4B"/>
    <text x="36" y="450" font-family="Inter, Roboto, SF Pro, sans-serif" font-size="11" font-weight="400" fill="#64748B">Connected: 615 " Interested: 265 " 4 Callers</text>

    <line x1="36" y1="460" x2="354" y2="460" stroke="#F1F5F9"/>

