      <rect x="248" y="776" width="18" height="14" rx="7" fill="#DC2626"/>
      <text x="257" y="786" text-anchor="middle" font-family="Inter, Roboto, SF Pro, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">11</text>
      <text x="242" y="820" text-anchor="middle" font-family="Inter, Roboto, SF Pro, sans-serif" font-size="11" font-weight="500" fill="#64748B">Follow-ups</text>
    </g>

