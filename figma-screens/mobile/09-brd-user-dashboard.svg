      <rect x="43" y="784" width="6" height="6" rx="1" stroke="#801321" stroke-width="1.6"/>
      <rect x="51" y="784" width="6" height="6" rx="1" stroke="#801321" stroke-width="1.6"/>
      <rect x="43" y="792" width="6" height="6" rx="1" stroke="#801321" stroke-width="1.6"/>
      <rect x="51" y="792" width="6" height="6" rx="1" stroke="#801321" stroke-width="1.6"/>
