    <!-- Top Close Handle: Centered Feather chevron-down icon (22px #94A3B8) -->
    <g id="Top Close Handle" transform="translate(184, 354)">
      <path d="M5.5 8.25L11 13.75L16.5 8.25" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

