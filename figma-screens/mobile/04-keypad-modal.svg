        <text x="195" y="622" text-anchor="middle" font-family="Inter, Roboto, SF Pro, sans-serif" font-size="22" font-weight="600" fill="#1E293B">8</text>
        <text x="195" y="638" text-anchor="middle" font-family="Inter, Roboto, SF Pro, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8" fill="#94A3B8">TUV</text>
      </g>
      <g id="Key 9">
