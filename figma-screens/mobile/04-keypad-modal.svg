      <g transform="translate(160, 758) scale(0.833)">
        <path d="M14.05 2A9 9 0 0 1 22.05 9.94M14.05 6A5 5 0 0 1 18 10M22 16.92V19.92A2 2 0 0 1 19.82 21.92A19.79 19.79 0 0 1 11.19 18.85A19.5 19.5 0 0 1 5.19 12.85A19.79 19.79 0 0 1 2.12 4.18A2 2 0 0 1 4.11 2H7.11A2 2 0 0 1 9.11 3.72A12.84 12.84 0 0 0 9.81 6.53A2 2 0 0 1 9.36 8.64L8.09 9.91A16 16 0 0 0 14.09 15.91L15.36 14.64A2 2 0 0 1 17.47 14.19A12.84 12.84 0 0 0 20.28 14.89A2 2 0 0 1 22 16.92Z" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
