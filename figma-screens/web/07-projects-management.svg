      <text x="1082" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B2437">Outreach to past and prospective donors</text>
      <text x="1082" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B2437">for annual higher education &amp; zakat fund.</text>

      <!-- Field 3: Start / End Date -->
      <text x="1068" y="366" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2437">Start Date</text>
      <rect x="1068" y="374" width="152" height="42" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <text x="1080" y="400" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B2437">01 Oct 2026</text>

      <text x="1232" y="366" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2437">End Date</text>
      <rect x="1232" y="374" width="152" height="42" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <text x="1244" y="400" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B2437">15 Dec 2026</text>

      <!-- Field 4: Status * (Active / Closed) -->
      <text x="1068" y="444" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2437">Project Status <tspan fill="#DC2626">*</tspan></text>
      <rect x="1068" y="452" width="152" height="40" rx="8" fill="#7A1424" fill-opacity="0.08" stroke="#7A1424" stroke-width="1.2"/>
      <text x="1144" y="477" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A1424">Ï Active</text>

      <rect x="1232" y="452" width="152" height="40" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      <text x="1308" y="477" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B7694">Ë Closed</text>

      <!-- Field 5: Assigned Users * -->
      <text x="1068" y="520" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2437">Assigned Users <tspan fill="#DC2626">*</tspan></text>
      <rect x="1068" y="528" width="316" height="156" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>

      <!-- Selected User Checkboxes -->
      <rect x="1082" y="542" width="16" height="16" rx="4" fill="#7A1424"/>
      <path d="M1085.5 550L1088.5 553L1094.5 547" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="1108" y="555" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2437">Ansari Mohammed Afzal</text>

      <rect x="1082" y="574" width="16" height="16" rx="4" fill="#7A1424"/>
      <path d="M1085.5 582L1088.5 585L1094.5 579" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="1108" y="587" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2437">Fatima Siddiqui</text>

      <rect x="1082" y="606" width="16" height="16" rx="4" fill="#7A1424"/>
      <path d="M1085.5 614L1088.5 617L1094.5 611" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="1108" y="619" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#1B2437">Syed Mudassir Ali</text>

      <rect x="1082" y="638" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="1108" y="651" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7694">Rehan Qureshi</text>

      <!-- Save Project Button -->
      <rect x="1068" y="712" width="316" height="44" rx="8" fill="#7A1424"/>
      <text x="1226" y="739" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Save Project Changes</text>
