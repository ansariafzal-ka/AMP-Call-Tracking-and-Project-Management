    <rect x="1036" y="32" width="76" height="32" rx="6" fill="#7A1424"/>
    <text x="1074" y="52" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">All (6)</text>
    <text x="1148" y="52" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#1B2437">Active (4)</text>
    <text x="1216" y="52" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7694">Closed (2)</text>

    <rect x="1264" y="28" width="144" height="40" rx="8" fill="#7A1424"/>
    <text x="1336" y="53" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">+ Create Project</text>

