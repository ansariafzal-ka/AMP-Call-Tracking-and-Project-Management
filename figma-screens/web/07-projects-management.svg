        <text x="308" y="652" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6B7694">Annual Teachers Training Workshop</text>
        <rect x="576" y="636" width="60" height="22" rx="11" fill="#E5E7EB"/>
