        <text x="308" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7694">Start / End Date:</text>
        <text x="412" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1B2437">01 Oct 2026  15 Dec 2026</text>

        <text x="600" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7694">Assigned Users:</text>
        <text x="700" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1B2437">Ansari Afzal, Fatima S., +3 more</text>

        <rect x="308" y="276" width="580" height="8" rx="4" fill="#F3F4F6"/>
        <rect x="308" y="276" width="475" height="8" rx="4" fill="#7A1424"/>
        <text x="988" y="284" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1B2437">980 / 1,200 (82%)</text>
