        <text x="412" y="406" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1B2437">10 Oct 2026  20 Nov 2026</text>

        <text x="600" y="406" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7694">Assigned Users:</text>
