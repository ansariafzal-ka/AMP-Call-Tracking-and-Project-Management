      <text x="1008" y="133" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B7694">Showing 4 Active, 2 Closed</text>
      <line x1="268" y1="164" x2="1028" y2="164" stroke="#F3F4F6" stroke-width="1"/>

      <!-- Project Item 1 -->
      <g id="Project Card Row 1">
        <rect x="288" y="180" width="720" height="132" rx="10" fill="#FFFFFF" stroke="#7A1424" stroke-width="1.2"/>
        <text x="308" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B2437">Ramadan Zakat &amp; Scholarship Drive 2026</text>
        <rect x="622" y="192" width="60" height="22" rx="11" fill="#D1FAE5"/>
        <text x="652" y="207" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#065F46">Active</text>
        <text x="988" y="207" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#7A1424">Edit Project</text>

