      <text x="1068" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7694">Configure project details &amp; assign callers</text>
      <line x1="1044" y1="158" x2="1408" y2="158" stroke="#F3F4F6" stroke-width="1"/>

